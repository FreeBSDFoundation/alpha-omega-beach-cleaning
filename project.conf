vendor=FreeBSD-Foundation
package=alpha-omega-beach-cleaning
version=20250922

targets=CODEOWNERS,dependencies.md,format,jsonld,merge-versions,pkgconfig,plan.md,security.md,spdx,src/aobc-tool,versions.yml
subdirs=doc,src
dist=COPYING,Makefile,README.md,database.yml,tools/jsonld.sh,tools/spdx.sh

#dist
[README.md]
install=$(PREFIX)/share/doc/$(PACKAGE)

#targets
[CODEOWNERS]
type=command
command=$(OBJDIR)src/aobc-tool generate codeowners
depends=$(OBJDIR)src/aobc-tool,database.yml

[dependencies.md]
type=command
command=$(OBJDIR)src/aobc-tool generate dependencies
depends=$(OBJDIR)src/aobc-tool,database.yml

[format]
type=command
command=go fmt src/cmd/aobc-tool/aobc-tool.go
phony=1
enabled=0

[jsonld]
depends=tools/jsonld.sh,pkgconfig
type=script
script=./tools/jsonld.sh
enabled=0
phony=1

[merge-versions]
type=command
command=@(yq eval-all 'select(fileIndex == 0) * select(fileindex == 1)' database.yml versions.yml)
depends=$(OBJDIR)versions.yml
phony=1
enabled=0

[pkgconfig]
command=$(OBJDIR)src/aobc-tool generate pkgconfig
depends=$(OBJDIR)src/aobc-tool,database.yml
type=command
enabled=0
phony=1

[plan.md]
type=command
command=$(OBJDIR)src/aobc-tool generate plan
depends=$(OBJDIR)src/aobc-tool,database.yml

[security.md]
type=command
command=$(OBJDIR)src/aobc-tool generate securityreview
depends=$(OBJDIR)src/aobc-tool,database.yml

[spdx]
depends=tools/spdx.sh,pkgconfig
type=script
script=./tools/spdx.sh
enabled=0
phony=1

[src/aobc-tool]
type=command
command=cd src && $(MAKE) $(OBJDIR)aobc-tool
enabled=0

[versions.yml]
type=command
command=@(cd src/versions; echo "Sections:"; ./bmake; ./byacc; ./dtc; ./unifdef; ./libc; ./lyaml; ./mkuzip; ./acpi; ./ipfilter; ./zfs; ./zlib; ./zstd; ./bsnmp; ./ldns; ./libpcap; ./dma; ./ntp; ./openssh; ./sendmail; ./unbound; ./wireguard; ./wpa_supplicant; ./tcpdump; ./openssl; ./bsddialog; ./bzip2; ./flex; ./heimdal; ./libarchive; ./libedit; ./libevent; ./libexpat; ./liblzma; ./libmagic; ./libxo; ./ncurses; ./openpam; ./sqlite; ./tzdata; ./awk; ./bc; ./diff; ./less; ./lua; ./patch; ./pkg; ./kyua) > versions.yml
depends=all
enabled=0
